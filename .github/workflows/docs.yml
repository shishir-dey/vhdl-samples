name: Documentation

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements.txt
        
    - name: Install GHDL (for examples)
      run: |
        sudo apt-get update
        sudo apt-get install -y ghdl
        ghdl --version
        
    - name: Setup project
      run: |
        chmod +x scripts/run_tests.sh
        
    - name: Generate project statistics
      run: |
        # Create a statistics file for documentation
        mkdir -p docs/_generated
        echo "# Auto-generated project statistics" > docs/_generated/stats.rst
        echo "Project Statistics" >> docs/_generated/stats.rst
        echo "==================" >> docs/_generated/stats.rst
        echo "" >> docs/_generated/stats.rst
        echo "Generated on: $(date)" >> docs/_generated/stats.rst
        echo "" >> docs/_generated/stats.rst
        make stats | tail -n +2 >> docs/_generated/stats.rst
        
    - name: Build Sphinx documentation
      run: |
        cd docs
        make html
        
    - name: Setup Pages
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
      uses: actions/configure-pages@v3
      
    - name: Upload artifact
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v2
      
  test-docs:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements.txt
        
    - name: Test documentation build
      run: |
        cd docs
        make html
        
    - name: Check for broken links
      run: |
        cd docs
        make linkcheck
        
    - name: Validate HTML
      run: |
        pip install html5validator
        html5validator --root docs/_build/html --also-check-css
        
    - name: Check documentation coverage
      run: |
        cd docs
        make coverage
        cat _build/coverage/python.txt || true 