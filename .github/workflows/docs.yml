name: Documentation

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements.txt
        
    - name: Install GHDL (for examples)
      run: |
        sudo apt-get update
        sudo apt-get install -y ghdl
        ghdl --version
        
    - name: Setup project
      run: |
        chmod +x scripts/run_tests.sh
        
    - name: Generate project statistics
      run: |
        # Create a statistics file for documentation
        mkdir -p docs/_generated
        echo "# Auto-generated project statistics" > docs/_generated/stats.rst
        echo "Project Statistics" >> docs/_generated/stats.rst
        echo "==================" >> docs/_generated/stats.rst
        echo "" >> docs/_generated/stats.rst
        echo "Generated on: $(date)" >> docs/_generated/stats.rst
        echo "" >> docs/_generated/stats.rst
        make stats | tail -n +2 >> docs/_generated/stats.rst
        
    - name: Build Sphinx documentation
      run: |
        cd docs
        make html
        
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_build/html
        publish_branch: gh-pages
        force_orphan: true
      
  test-docs:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements.txt
        
    - name: Test documentation build
      run: |
        cd docs
        make html 